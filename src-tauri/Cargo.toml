[package]
name = "tinker-search"
version = "1.0.0"
description = "tinker搜索 — Windows 本地文件即时搜索"
authors = ["tinker"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tinker_search_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
parking_lot = "0.12"
rayon = "1.12"
encoding_rs = "0.8"
# 自然语言搜索的时间解析（本地时区、夏令时正确）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 内置语义模型 bge-small-zh-v1.5：ORT 静态链接进 exe，不需要额外 DLL
ort = { version = "2.0.0-rc.15", features = ["download-binaries"] }
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
# 原生索引内核（MFT 枚举 + 列式索引 + USN 实时同步）
sscore = { path = "../sscore" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
